<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Live Text Display</title>
<style>
* { box-sizing: border-box; }
body { margin: 0; padding: 25px; background: #0f172a; color: white; font-family: Arial, sans-serif; }
.container { max-width: 640px; margin: auto; }
h2 { text-align: center; margin-bottom: 8px; }
.connection { text-align: center; color: #94a3b8; margin-bottom: 22px; }
.dot { color: #ef4444; }
.dot.on { color: #22c55e; }
.card { background: #1e293b; padding: 22px; border-radius: 18px; margin-bottom: 18px; box-shadow: 0 5px 15px #0003; }
.label { color: #94a3b8; font-size: 14px; margin-bottom: 10px; }
.big { font-size: 38px; font-weight: bold; color: #38bdf8; text-align: center; word-wrap: break-word; overflow-wrap: anywhere; line-height: 1.25; padding: 14px 0; white-space: pre-wrap; }
.big.empty { color: #475569; font-size: 24px; }
.meta { text-align: center; color: #64748b; font-size: 13px; margin-top: 6px; }
.item { padding: 12px 0; border-bottom: 1px solid #334155; }
.item:last-child { border-bottom: none; }
.item .who { color: #38bdf8; font-size: 13px; }
.item .when { color: #64748b; font-size: 12px; float: right; }
.item .txt { margin-top: 4px; word-wrap: break-word; overflow-wrap: anywhere; white-space: pre-wrap; }
.empty-list { color: #64748b; text-align: center; padding: 10px 0; }
.send { display: flex; gap: 10px; }
.send input { flex: 1; background: #0f172a; border: 1px solid #334155; border-radius: 10px; padding: 12px; color: white; font-size: 15px; min-width: 0; }
.send button { background: #38bdf8; color: #0f172a; border: none; border-radius: 10px; padding: 0 20px; font-weight: bold; cursor: pointer; font-size: 15px; }
.hint { color: #64748b; font-size: 12px; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <h2>Live Text Display</h2>
  <div class="connection"><span class="dot" id="dot">●</span> <span id="connection">Connecting...</span></div>

  <div class="card">
    <div class="label">Latest message</div>
    <div class="big empty" id="big">No messages yet</div>
    <div class="meta" id="meta"></div>
  </div>

  <div class="card">
    <div class="label">Recent messages</div>
    <div id="list"><div class="empty-list">Nothing yet</div></div>
  </div>

  <div class="card">
    <div class="label">Send a message from here</div>
    <div class="send">
      <input id="msg" maxlength="500" placeholder="Type a message...">
      <button id="btn">Send</button>
    </div>
    <div class="hint" id="hint">Or send it with the API: POST /api/text</div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let lastId = 0;

function timeOf(ts) {
  const d = new Date(ts);
  return isNaN(d) ? "" : d.toLocaleTimeString();
}

function render(list) {
  if (!list.length) return;
  const latest = list[list.length - 1];
  const big = $("big");
  big.textContent = latest.text;
  big.classList.remove("empty");
  $("meta").textContent = `From ${latest.sender} • ${timeOf(latest.timestamp)}`;

  const box = $("list");
  box.innerHTML = "";
  list.slice().reverse().forEach((m) => {
    const row = document.createElement("div");
    row.className = "item";
    const when = document.createElement("span"); when.className = "when"; when.textContent = timeOf(m.timestamp);
    const who = document.createElement("span"); who.className = "who"; who.textContent = m.sender;
    const txt = document.createElement("div"); txt.className = "txt"; txt.textContent = m.text;
    row.append(when, who, txt);
    box.appendChild(row);
  });
}

async function poll() {
  try {
    const list = await (await fetch("/api/history?limit=20")).json();
    $("dot").classList.add("on");
    $("connection").innerText = "Live";
    const newest = list.length ? list[list.length - 1].id : 0;
    if (newest !== lastId) { lastId = newest; render(list); }
  } catch (e) {
    $("dot").classList.remove("on");
    $("connection").innerText = "Server not reachable";
  }
}

async function sendMsg() {
  const input = $("msg");
  const text = input.value.trim();
  if (!text) return;
  try {
    const r = await fetch("/api/text", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ sender: "web", text, timestamp: new Date().toISOString() }),
    });
    const j = await r.json();
    $("hint").textContent = j.ok ? "Sent!" : "Error: " + j.error;
    if (j.ok) { input.value = ""; poll(); }
  } catch (e) { $("hint").textContent = "Could not reach the server"; }
}

$("btn").addEventListener("click", sendMsg);
$("msg").addEventListener("keydown", (e) => { if (e.key === "Enter") sendMsg(); });

poll();
setInterval(poll, 1500);
</script>
</body>
</html>
